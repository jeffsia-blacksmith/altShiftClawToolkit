name: '📚 Sync Template'
run-name: "📚 Template sync: ${{ inputs.template_name }} | req:${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      template_name:
        description: 'Template name'
        required: true
        type: string
      request_id:
        description: 'Workflow notification request ID'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: "templates-install-${{ github.repository }}-${{ inputs.template_name }}"
  cancel-in-progress: false

env:
  TEMPLATE_NAME: "${{ inputs.template_name }}"
  PUSH_TOKEN: "${{ secrets.CLAW_SYS_GITHUB_TOKEN || github.token }}"
  AUTOMATION_GIT_USER_NAME: "${{ vars['AUTOMATION_GIT_USER_NAME'] || 'github-actions[bot]' }}"
  AUTOMATION_GIT_USER_EMAIL: "${{ vars['AUTOMATION_GIT_USER_EMAIL'] || 'github-actions[bot]@users.noreply.github.com' }}"
  TEMPLATES_SOURCE_REPO: "jeffsia-blacksmith/altShiftClawToolkit"
  REQUEST_ID: "${{ inputs.request_id }}"

jobs:
  install-template:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate input parameters
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TEMPLATE_NAME}" ]]; then
            echo "::error::template_name is required"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ env.PUSH_TOKEN }}

      - name: Checkout template from template repo
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TEMPLATES_SOURCE_REPO }}
          ref: main
          path: templates-source

      # installer/templates is the single source of truth; templates/ is a legacy compatibility
      # mirror kept for instances whose planted workflow still reads it. Resolve at run time and
      # accept either, so an upstream directory move can never silently break this sync again
      # (a hard-coded sparse-checkout of one path is what broke it before).
      - name: Resolve template source path
        id: template_src
        shell: bash
        run: |
          set -euo pipefail

          for candidate in "installer/templates" "templates"; do
            if [[ -d "templates-source/${candidate}/${TEMPLATE_NAME}" ]]; then
              echo "path=${candidate}" >> "$GITHUB_OUTPUT"
              echo "Resolved template source: ${candidate}/${TEMPLATE_NAME}"
              exit 0
            fi
          done

          echo "::error::template '${TEMPLATE_NAME}' not found in ${TEMPLATES_SOURCE_REPO}@main"
          echo "Available templates:"
          for candidate in "installer/templates" "templates"; do
            [[ -d "templates-source/${candidate}" ]] || continue
            find "templates-source/${candidate}" -mindepth 1 -maxdepth 1 -type d -printf '  - %f\n' | sort
          done
          exit 1

      - name: Sync template to main branch
        shell: bash
        env:
          TEMPLATE_SRC: ${{ steps.template_src.outputs.path }}
        run: |
          set -euo pipefail

          git config user.name "${AUTOMATION_GIT_USER_NAME}"
          git config user.email "${AUTOMATION_GIT_USER_EMAIL}"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"

          git fetch --no-tags origin main
          git checkout -B main origin/main

          TEMPLATE_SOURCE_DIR="templates-source/${TEMPLATE_SRC}/${TEMPLATE_NAME}"
          INSTALL_PATH="templates/${TEMPLATE_NAME}"
          mkdir -p "${INSTALL_PATH}"
          rsync -a --delete "${TEMPLATE_SOURCE_DIR}/" "${INSTALL_PATH}/"

          # Sync any extra template workflow files to .github/workflows/
          TEMPLATE_WF_DIR="${TEMPLATE_SOURCE_DIR}/.github/workflows"
          if [[ -d "${TEMPLATE_WF_DIR}" ]]; then
            mkdir -p ".github/workflows"
            shopt -s nullglob
            for wf_file in "${TEMPLATE_WF_DIR}"/*.yml "${TEMPLATE_WF_DIR}"/*.yaml; do
              wf_name="$(basename "${wf_file}")"
              [[ "${wf_name}" == "issue-N.yml" ]] && continue
              echo "Copying workflow: ${wf_name}"
              cp "${wf_file}" ".github/workflows/${wf_name}"
            done
            shopt -u nullglob
          fi

          git add -A -- "${INSTALL_PATH}" ".github/workflows"
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "feat: sync template '${TEMPLATE_NAME}'"
          git push origin HEAD:main

      - name: Summary
        if: always()
        shell: bash
        env:
          TEMPLATE_SRC: ${{ steps.template_src.outputs.path }}
        run: |
          {
            echo "### 📚 Template Sync Result"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Template | \`${TEMPLATE_NAME}\` |"
            echo "| Source | \`${TEMPLATE_SRC:-unresolved}\` |"
            echo "| Target | \`templates/${TEMPLATE_NAME}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
